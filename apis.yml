name: Pixis
description: 'Pixis is an AI-powered advertising and marketing platform for consumer brands,
  built on proprietary codeless AI infrastructure that plans, creates, and optimizes digital
  advertising across channels. Its products include Prism (campaign performance optimization
  and cross-channel analytics), Adroom (generative AI creative production for ad assets), and
  Visibility (AI-search presence tracking and optimization). Pixis connects directly to
  marketing and ad platforms such as Google, Meta, and Salesforce to automate media buying,
  creative generation, and performance optimization from one place. The company is backed by
  SoftBank Vision Fund, with engineering operations in India. Pixis does not publish a public
  developer API or documentation; it is an enterprise, demo-led SaaS platform.'
