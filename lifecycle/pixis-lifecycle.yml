name: Pixis — API lifecycle and operational transparency
description: >-
  Versioning, deprecation, status and change communication for Pixis. Every field below was
  probed. The headline finding is that the status page Pixis links from its own domain is
  password protected, so none of its uptime or incident data is public.

status_page:
  url: https://status.pixis.ai/
  http_status: 200
  platform: UptimeRobot public status page
  public: false
  gate: password
  evidence: >-
    The page renders a lock icon and the literal text "This status page is password protected."
    over a password form (input name pspPassword, hidden pspUrl "AlQLmsrVzp"). No monitors,
    components, uptime percentages or incidents are readable without the password.
  components_published: 0
  incident_history: false
  subscribe: false
  rss: false
  note: >-
    A 200 here is not evidence of a published status page. This artifact exists specifically so
    the hostname is not mistaken for operational transparency.

versioning:
  policy_published: false
  scheme: unknown
  evidence: >-
    No versioning policy on any Pixis surface. The pixis.ai sitemap (547 URLs across 11 section
    sitemaps) contains no developer, API, docs, or changelog page. prism-docs.pixis.ai carries
    77 end-user product pages and no API or versioning section.

deprecation:
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  rfc8594: false
  evidence: >-
    No deprecation policy published, and no callable public endpoint on which Sunset or
    Deprecation response headers could be observed.

sla:
  published: false
  evidence: >-
    No SLA, uptime commitment, or support-tier page. Pixis is a demo-led enterprise SaaS; terms
    are presumably contractual. There is not even a public terms-of-service page in the sitemap.

changelog:
  published: false
  url: null
  evidence: >-
    No changelog, release-notes or "what's new" page in the pixis.ai sitemap or in the
    prism-docs.pixis.ai navigation.

