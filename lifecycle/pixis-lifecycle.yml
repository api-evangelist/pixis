        "lockReason": "overusage", "allowPublicProjects": false. Pixis built an API-docs
        workspace and it is now locked and empty.

live_service_hosts_note: >-
  Recorded for operational context only. These are first-party application backends, not
  documented developer APIs, and none is wired into apis.yml as an API entry.

live_service_hosts_observed:
  - host: core-performance.pixis.ai
    status: 401
    detail: Express + express-jwt. Rejects anonymous callers with credentials_required.
    health: 'GET /health -> 200 {"success":true,"message":"Server Running Fine"}'
  - host: ws.pixis.ai
    status: 200
    detail: >-
      Socket.IO / Engine.IO v4 realtime service. GET /socket.io/?EIO=4&transport=polling returns
      200 with a session id, upgrades ["websocket"], pingInterval 25000, pingTimeout 20000,
      maxPayload 1000000. No published channel or event catalog.
  - host: analytics-core.pixis.ai
