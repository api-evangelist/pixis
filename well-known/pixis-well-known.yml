name: Pixis — /.well-known/ probe
description: >-
  Every /.well-known/ path probed across the Pixis host estate. Three real documents were
  served, all from auth.pixis.ai — the Auth0 custom domain Pixis runs for application login.
  Every other pixis.ai host answers /.well-known/* with its SPA or WordPress shell (a soft
  200 carrying HTML, which is a MISS, not a document) or with a 404.

hosts:

  - host: auth.pixis.ai
    note: >-
      Auth0 custom domain owned by Pixis (CNAME -> cross-platform-prod-cd-fgeqiir7hsah8pdh.edge.tenants.us.auth0.com).
      The discovery document self-identifies as "https://auth.pixis.ai/" in `issuer`, and the
      Pixis Prism SPA configures Auth0Provider with domain "auth.pixis.ai" — so the host and
      the tenant both belong to Pixis.
    paths:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        document: true
        file: pixis-auth-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        document: true
        file: pixis-auth-oauth-authorization-server.json
        note: Byte-identical to the openid-configuration response.
      - path: /.well-known/jwks.json
        status: 200
        content_type: application/json
        document: true
        file: pixis-auth-jwks.json
        note: Two RSA signing keys (RS256). Public key material only.
